;;
;; Miss Lemon package
;;
[metadata]
name = miss-lemon
version = 0.2.0-pre.5
description = Rename a file structure with auto incremented prefix number
long_description = file:README.rst
long_description_content_type = text/x-rst
author = David Thenon
author_email = sveetch@gmail.com
url = https://github.com/sveetch/miss-lemon
project_urls =
    Source Code = https://github.com/sveetch/miss-lemon
    Issue Tracker = https://github.com/sveetch/miss-lemon/issues
    Changelog = https://miss-lemon.readthedocs.io/en/latest/history.html
    Documentation = https://miss-lemon.readthedocs.io/
license = MIT
keywords = Python
classifiers =
    Development Status :: 2 - Pre-Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11

[options]
python_requires = >=3.10
include_package_data = True
install_requires =
    click>=8.0
    bigtree>=1.5.3
    colorlog
packages = find:
zip_safe = True

[options.extras_require]
dev =
    pytest>=7.0.0
quality =
    flake8>=6.0.0
    tox>=4.11.0
doc =
    sphinx>=8.0.2
    furo>=2024.8.6
    sphinx-copybutton>=0.5.2
doc-live =
    livereload>=2.6.0
release =
    twine>=5.0.0

[options.packages.find]
where = .
exclude=
    dist
    data
    docs
    tests

[options.entry_points]
console_scripts =
    miss_lemon = miss_lemon.cli.entrypoint:cli_frontend

[wheel]
universal = 0

;;
;; Third-party packages configuration
;;
[flake8]
max-line-length = 88
exclude =
    .git,
    .venv,
    build,
    __pycache__,
    tests/data_fixtures

[tool:pytest]
addopts = -vv --ignore=tests/data_fixtures
python_files =
    *.py
testpaths =
    tests

[tox:tox]
minversion = 3.4.0
envlist =  py{310,311}

[testenv]

commands =
    pip install -e .[dev]
    pytest -vv tests
